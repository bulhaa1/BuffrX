[package]
name = "buffrx-share"
version = "1.0.0"
edition = "2021"
description = "BuffrX's app-to-app clip sharing helper: started by the engine only while a link is live or a clip is arriving."
license = "GPL-2.0-or-later"

[dependencies]
iroh = "=1.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
subtle = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
