version: 2
updates:
  # Workflow actions are pinned by commit hash, so they only move when Dependabot moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      editor:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-share
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      share:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      shell:
        update-types: [minor, patch]
