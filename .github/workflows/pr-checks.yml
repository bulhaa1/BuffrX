name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly clean build: no caches are restored, so a cache can never hide a broken build for long.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      editor: ${{ steps.paths.outputs.editor }}
      native: ${{ steps.paths.outputs.native }}
      build: ${{ steps.paths.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        shell: pwsh
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json
          $base = if ($event.pull_request) { $event.pull_request.base.sha } else { $event.before }
          $editor = $false; $native = $false; $build = $false
          if (-not $base -or $base -match '^0+$') {
            $editor = $true; $native = $true; $build = $true
          } else {
            $files = @(git diff --name-only $base HEAD)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot determine changed files.' }
            foreach ($file in $files) {
              if ($file -match '^ui/') { $editor = $true; $build = $true }
              elseif ($file -match '^docs/protocol\.md$') { $native = $true }
              elseif ($file -match '\.md$|^\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md$|dependabot\.yml$)') { continue }
              elseif ($file -match '^(src/|tests/|src-tauri/|src-share/|tools/|CMakeLists\.txt$|assets/|brand/)') {
                $native = $true; $build = $true
              } else { $editor = $true; $native = $true; $build = $true }
            }
          }
          "editor=$($editor.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "native=$($native.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "build=$($build.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Whitespace, public-document links, the privacy rules (no private files, machine paths, personal
      # emails or credentials in anything tracked) and the installer's no-delete rule.
      - shell: pwsh
        run: |
          ./tools/test-whitespace.ps1
          ./tools/verify.ps1 -Area Docs
      # Lints every workflow file, this one included. Pinned by release and hash.
      - shell: bash
        run: |
          curl -fsSL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
          rm actionlint actionlint.tgz

  editor:
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      # Shipped code only: a known high-severity hole in a runtime dependency blocks the merge.
      - run: npm audit --omit=dev --audit-level=high --prefix ui
      - shell: pwsh
        run: ./tools/verify.ps1 -Area Editor

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/toolchain
          key: minimal-${{ runner.os }}-${{ hashFiles('tools/bootstrap-toolchain.ps1') }}
      - shell: powershell
        run: ./tools/bootstrap-toolchain.ps1 -Minimal
      - shell: powershell
        run: ./tools/verify.ps1 -Area Native
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-test-logs
          path: build-contrib/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name != 'schedule'
        with:
          path: |
            work/toolchain
            work/cargo/registry
          key: full-${{ runner.os }}-${{ hashFiles('tools/bootstrap-toolchain.ps1', 'tools/bootstrap-rust.ps1', '**/Cargo.lock') }}
      # Compiled output from the last merge to main: C++ objects (ccache) and the Rust dependency builds.
      # Only main saves it, so a pull request can read it but never overwrites it. The weekly run skips it.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name != 'schedule'
        id: warm
        with:
          path: |
            .ccache
            src-share/target
            src-tauri/target
          key: warm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'tools/bootstrap-rust.ps1') }}-${{ github.sha }}
          restore-keys: |
            warm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'tools/bootstrap-rust.ps1') }}-
            warm-${{ runner.os }}-
      # If ccache cannot be installed the build simply runs without it.
      - name: ccache
        if: github.event_name != 'schedule'
        continue-on-error: true
        shell: powershell
        run: |
          choco install ccache --no-progress -y
          if ($LASTEXITCODE -eq 0 -and (Get-Command ccache -ErrorAction SilentlyContinue)) {
            "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV
            "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $env:GITHUB_ENV
            "CCACHE_DIR=$env:GITHUB_WORKSPACE\.ccache" >> $env:GITHUB_ENV
            "CCACHE_MAXSIZE=1G" >> $env:GITHUB_ENV
          }
      - shell: powershell
        run: |
          ./tools/bootstrap-toolchain.ps1
          ./tools/bootstrap-rust.ps1
          ./tools/prepare-runtime.ps1
          ./tools/prepare-headers.ps1
      - run: npm ci --prefix ui
      - shell: powershell
        run: ./tools/verify.ps1 -Area Build
      # The sharing helper and the editor shell have their own Rust tests; the build alone never ran them.
      - shell: powershell
        run: ./tools/verify.ps1 -Area Rust
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.warm.outputs.cache-hit != 'true'
        with:
          path: |
            .ccache
            src-share/target
            src-tauri/target
          key: warm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'tools/bootstrap-rust.ps1') }}-${{ github.sha }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-logs
          path: |
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
            build/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  pr-gate:
    if: always()
    needs: [changes, docs, editor, native, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES: ${{ needs.changes.result }}
      DOCS: ${{ needs.docs.result }}
      EDITOR_REQUIRED: ${{ needs.changes.outputs.editor }}
      NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
      BUILD_REQUIRED: ${{ needs.changes.outputs.build }}
      EDITOR: ${{ needs.editor.result }}
      NATIVE: ${{ needs.native.result }}
      BUILD: ${{ needs.build.result }}
    steps:
      - shell: pwsh
        run: |
          $summary = @('| Check | Needed | Result |', '|---|---|---|', "| changes | yes | $env:CHANGES |", "| docs | yes | $env:DOCS |")
          foreach ($area in @('EDITOR', 'NATIVE', 'BUILD')) {
            $summary += "| $($area.ToLower()) | $([Environment]::GetEnvironmentVariable("${area}_REQUIRED")) | $([Environment]::GetEnvironmentVariable($area)) |"
          }
          $summary >> $env:GITHUB_STEP_SUMMARY
          if ($env:CHANGES -ne 'success' -or $env:DOCS -ne 'success') { throw 'Required setup/docs job failed.' }
          foreach ($area in @('EDITOR', 'NATIVE', 'BUILD')) {
            $required = [Environment]::GetEnvironmentVariable("${area}_REQUIRED")
            $result = [Environment]::GetEnvironmentVariable($area)
            if ($required -notin @('true', 'false')) { throw "Missing route for $area" }
            if ($required -eq 'true' -and $result -ne 'success') { throw "$area checks did not pass: $result" }
            if ($required -eq 'false' -and $result -notin @('skipped', 'success')) { throw "Unexpected $area result: $result" }
          }
